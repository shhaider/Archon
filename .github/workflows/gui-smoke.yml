name: GUI Smoke

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      PORT: '3099'
      ARCHON_HOME: /tmp/archon-gui-smoke-home
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version (for cache key)
        id: pw-version
        run: |
          version=$(node -e "console.log(require('./packages/gui-smoke/package.json').devDependencies['@playwright/test'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers and system deps
        run: bun run test:gui:install

      - name: Run GUI smoke
        run: bun run test:gui

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-report
          path: packages/gui-smoke/playwright-report
          retention-days: 14

      - name: Upload test results (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-test-results
          path: packages/gui-smoke/test-results
          retention-days: 14

      - name: Upload final screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-final-screenshot
          path: packages/gui-smoke/screenshots
          retention-days: 14
          if-no-files-found: ignore
