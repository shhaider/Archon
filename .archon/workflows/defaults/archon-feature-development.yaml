name: archon-feature-development
description: |
  Use when: Implementing a feature from an existing plan.
  Input: Path to a plan file ($ARTIFACTS_DIR/plan.md) or GitHub issue containing a plan.
  Does: Implements the plan with validation loops -> creates pull request.
  NOT for: Creating plans (plans should be created separately), bug fixes, code reviews.

nodes:
  - id: implement
    command: archon-implement
    model: opus[1m]

  - id: create-pr
    command: archon-create-pr
    depends_on: [implement]
    context: fresh

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      PR_REF=""
      if [ -s "$ARTIFACTS_DIR/.pr-url" ]; then
        PR_REF=$(tr -d '[:space:]' < "$ARTIFACTS_DIR/.pr-url")
      elif [ -s "$ARTIFACTS_DIR/.pr-number" ]; then
        PR_REF=$(tr -d '[:space:]' < "$ARTIFACTS_DIR/.pr-number")
      else
        PR_REF=$(gh pr list --head "$(git branch --show-current)" --state open --json url --jq '.[0].url')
      fi
      if [ -z "$PR_REF" ]; then
        echo "Could not resolve PR from $ARTIFACTS_DIR/.pr-url, .pr-number, or current branch" >&2
        exit 1
      fi
      ACTUAL=$(gh pr view "$PR_REF" --json baseRefName -q '.baseRefName')
      PR_NUMBER=$(gh pr view "$PR_REF" --json number -q '.number')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        echo "Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        gh pr edit "$PR_REF" --base "$EXPECTED"
      else
        echo "PR #$PR_NUMBER base verified: $EXPECTED"
      fi
    depends_on: [create-pr]
